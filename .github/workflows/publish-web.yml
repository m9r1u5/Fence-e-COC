name: Publish web app (GitHub Pages)

# Puts the app online at https://m9r1u5.github.io/Fence-e-COC/
# Open that link on a Windows PC (Edge or Chrome) and click Install.

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md', 'DISCLAIMER.md', 'tools/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the web app files (no signing key or build tools)
        run: |
          mkdir _site
          cp *.html *.js *.css *.json *.png *.pdf .nojekyll _site/
          ls -la _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
