name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./version.json').version")" >> "$GITHUB_OUTPUT"

      - name: Copy web app into www/
        run: |
          mkdir -p www
          cp *.html *.js *.css *.json *.png *.pdf www/
          rm -f www/package*.json www/coc.pdf www/tr.pdf

      - name: Set up Capacitor
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/browser@6
          npx cap init "Fence E-COC" "za.co.fenceecoc.app" --web-dir www
          npx cap add android

      - name: App icon, permissions and version
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-512.png $RES/mipmap-$d/ic_launcher.png
            cp icon-512.png $RES/mipmap-$d/ic_launcher_round.png
            cp icon-512.png $RES/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf $RES/mipmap-anydpi-v26
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.version }}\"/; s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          # Sign every build with the same key (fence.keystore) so new APKs install over the old app and keep its data
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("${rootDir}\/..\/fence.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -n -A8 "signingConfigs" android/app/build.gradle
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Fence-e-COC-${{ steps.ver.outputs.version }}.apk

      - name: Upload APK (Actions page)
        uses: actions/upload-artifact@v4
        with:
          name: Fence-e-COC-${{ steps.ver.outputs.version }}-apk
          path: Fence-e-COC-*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          name: Fence E-COC ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            Android APK for Fence E-COC ${{ steps.ver.outputs.version }} (build ${{ github.run_number }}).
            Download **Fence-e-COC-${{ steps.ver.outputs.version }}.apk** below, open it, and allow "Install unknown apps" if Android asks.
            Web / Windows PC / iPhone version: https://m9r1u5.github.io/Fence-e-COC/
            On a PC open the link in Edge or Chrome and click Install. On iPhone open it in Safari → Share → Add to Home Screen.
          files: Fence-e-COC-*.apk
          make_latest: true
